# mos-registry-product: gameserver
# mos-registry-release: trixie-wine
image:
  distribution: debian
  release: trixie
  architecture: amd64
  description: Debian Trixie SteamCMD Game Server with Wine

source:
  downloader: debootstrap
  url: http://deb.debian.org/debian

packages:
  manager: apt
  update: true
  cleanup: true

  sets:
    - action: install
      packages:
        # Base system
        - systemd
        - systemd-sysv
        - sudo
        - ca-certificates
        - locales
        - tzdata
        - ifupdown

        # Network / diagnostics
        - curl
        - wget
        - procps
        - iproute2
        - iputils-ping
        - dnsutils
        - net-tools
        - lsof

        # General tooling
        - jq
        - file
        - rsync
        - tar
        - xz-utils
        - gzip
        - bzip2
        - unzip
        - nano
        - less

        # Common 64-bit runtime dependencies
        - libc6
        - libgcc-s1
        - libstdc++6
        - wine64
        - winbind

actions:
  - trigger: post-packages
    action: |
      #!/bin/sh
      set -eux

      # ------------------------------------------------------------
      # Required directories
      # ------------------------------------------------------------

      mkdir -p \
        /etc/gameserver/secrets \
        /srv/gameserver \
        /opt/steamcmd \
        /var/lib/gameserver-manager \
        /var/log/gameserver-manager \
        /run/gameserver-manager

      # Keep secrets host-managed by default. BattleCTL/gameserver normally
      # runs with sufficient privilege to read them, while game processes do
      # not need access to Steam credentials.
      chmod 0700 /etc/gameserver/secrets

      # Runtime directories under /run disappear on boot. The gameserver CLI
      # must be able to create its own authority state as the steam user.
      mkdir -p /etc/tmpfiles.d
      cat > /etc/tmpfiles.d/gameserver-manager.conf <<'EOF'
      d /run/gameserver-manager 0750 steam steam -
      EOF
      # UID 1000 is created later in this action, so ownership is set after
      # useradd below.

      # ------------------------------------------------------------
      # Locale
      # ------------------------------------------------------------

      if ! grep -q '^en_US.UTF-8 UTF-8$' /etc/locale.gen; then
        echo 'en_US.UTF-8 UTF-8' >> /etc/locale.gen
      fi

      locale-gen
      update-locale LANG=en_US.UTF-8

      # ------------------------------------------------------------
      # Network
      #
      # MOS supplies eth0 through the LXC config, but a minimal Debian
      # debootstrap image does not automatically request an IPv4 lease.
      # networking.service/ifupdown is already the native Debian path here,
      # so explicitly configure eth0 for DHCP.
      # ------------------------------------------------------------

      mkdir -p /etc/network/interfaces.d

      cat > /etc/network/interfaces.d/eth0 <<'EOF'
      auto eth0
      iface eth0 inet manual
      EOF

      systemctl enable networking.service

      # ------------------------------------------------------------
      # Steam / game-server user
      #
      # Host game data is intentionally kept outside the LXC and bind-mounted
      # at /srv/gameserver. The homelab convention is UID/GID 1000, so the
      # guest steam account uses the same IDs and sees mounted files with the
      # expected ownership. This can become parameterized when template ENV
      # rendering is added.
      # ------------------------------------------------------------

      if ! getent group 1000 >/dev/null 2>&1; then
        groupadd --gid 1000 steam
      elif ! getent group steam >/dev/null 2>&1; then
        existing_group="$(getent group 1000 | cut -d: -f1)"
        groupmod --new-name steam "$existing_group"
      fi

      if ! id steam >/dev/null 2>&1; then
        useradd \
          --uid 1000 \
          --gid 1000 \
          --create-home \
          --shell /bin/bash \
          steam
      fi

      # User-owned runtime state; the protected Steam credentials directory
      # remains root-only and is never made writable to game processes.
      chown steam:steam /run/gameserver-manager \
        /var/lib/gameserver-manager /var/log/gameserver-manager

      # ------------------------------------------------------------
      # Enable i386 runtime support
      # ------------------------------------------------------------

      dpkg --add-architecture i386
      apt-get update

      apt-get install -y \
        lib32gcc-s1 \
        lib32stdc++6 \
        libc6-i386

      # ------------------------------------------------------------
      # Directory ownership
      # ------------------------------------------------------------

      chown -R steam:steam \
        /opt/steamcmd \
        /srv/gameserver

      # ------------------------------------------------------------
      # Install SteamCMD
      # ------------------------------------------------------------

      cd /opt/steamcmd

      curl -fsSL \
        'https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz' \
        -o steamcmd_linux.tar.gz

      tar -xzf steamcmd_linux.tar.gz
      rm steamcmd_linux.tar.gz

      chown -R steam:steam /opt/steamcmd

      # Convenient command path. Use a wrapper instead of a symlink because
      # steamcmd.sh resolves its own directory from $0.
      cat > /usr/local/bin/steamcmd <<'EOF'
      #!/bin/sh
      exec /opt/steamcmd/steamcmd.sh "$@"
      EOF
      chmod 0755 /usr/local/bin/steamcmd

      # ------------------------------------------------------------
      # Warm SteamCMD once
      # ------------------------------------------------------------

      su -s /bin/bash steam -c \
        '/opt/steamcmd/steamcmd.sh +login anonymous +quit'

      # ------------------------------------------------------------
      # Steam SDK compatibility paths
      # ------------------------------------------------------------

      STEAM_HOME="$(getent passwd steam | cut -d: -f6)"

      mkdir -p \
        "$STEAM_HOME/.steam/sdk32" \
        "$STEAM_HOME/.steam/sdk64"

      if [ -f /opt/steamcmd/linux32/steamclient.so ]; then
        ln -sf \
          /opt/steamcmd/linux32/steamclient.so \
          "$STEAM_HOME/.steam/sdk32/steamclient.so"
      fi

      if [ -f /opt/steamcmd/linux64/steamclient.so ]; then
        ln -sf \
          /opt/steamcmd/linux64/steamclient.so \
          "$STEAM_HOME/.steam/sdk64/steamclient.so"
      fi

      # Final ownership pass after SteamCMD has extracted/updated files.
      chown -R steam:steam \
        /opt/steamcmd \
        /srv/gameserver \
        "$STEAM_HOME/.steam"

      # ------------------------------------------------------------
      # LXC hostname templates
      #
      # lxc-download replaces LXC_NAME in files listed by meta.tar.xz's
      # templates file when the container is created.
      # ------------------------------------------------------------

      printf '%s\n' 'LXC_NAME' > /etc/hostname

      cat > /etc/hosts <<'EOF'
      127.0.0.1 localhost
      127.0.1.1 LXC_NAME
      ::1 localhost ip6-localhost ip6-loopback
      ff02::1 ip6-allnodes
      ff02::2 ip6-allrouters
      EOF

      # ------------------------------------------------------------
      # Game-independent v2 gameserver configuration and Flow-ready HOME
      # ------------------------------------------------------------

      mkdir -p /etc/gameserver/games /home/steam/.local/bin /home/steam/.config/flow

      cat > /etc/gameserver/gameserver.yaml <<'EOF'
      version: 2
      defaults:
        library_dir: /srv/gameserver
        steam:
          login_profile: anonymous
          platform: linux
      steam_profiles:
        anonymous:
          username: anonymous
      EOF

      cat > /etc/gameserver/README.md <<'EOF'
      Generic game-server LXC image.
      Games are not installed in the base image.
      Provision a game-specific v2 profile under /etc/gameserver/games/,
      then use the shared gameserver CLI and Flow workflows.
      Install paths live below /srv/gameserver/<game>.
      EOF

      # Login and interactive Bash shells find host-managed read-only binaries.
      for profile in /home/steam/.profile /home/steam/.bashrc; do
        if ! grep -Fq 'HOME/.local/bin' "$profile" 2>/dev/null; then
          printf '%s\n' 'export PATH="$HOME/.local/bin:$PATH"' >> "$profile"
        fi
      done
      chown -R steam:steam /home/steam/.local /etc/gameserver/games /home/steam/.config
      chmod 0755 /home/steam/.local/bin

      # ------------------------------------------------------------
      # Final cleanup
      # ------------------------------------------------------------

      apt-get clean
      rm -rf /var/lib/apt/lists/*

targets:
  lxc:
    create_message: |-
      Wine-enabled SteamCMD game-server LXC created.

      Base image provides:
        - Debian Trixie amd64
        - systemd
        - eth0 interface prepared for host-assigned static IPv4
        - steam user (UID/GID 1000)
        - SteamCMD in PATH
        - i386 compatibility and common Steam runtime libraries
        - Steam SDK compatibility paths
        - /etc/gameserver and protected /etc/gameserver/secrets
        - /var/lib/gameserver-manager and /var/log/gameserver-manager
        - /srv/gameserver bind-mount target
        - /opt/steamcmd

      Intended topology:
        - one game server per LXC
        - durable game install/save/config data remains on host storage
        - host game directory is bind-mounted at /srv/gameserver
        - BattleCTL/gameserver binary may be bind-mounted or installed separately
        - game-specific BattleCTL config and systemd unit are provisioned after creation
        - authenticated Steam games require a one-time SteamCMD login/cache

      Example host mapping:
        /mnt/user/@home/matt/servers/<game> -> /srv/gameserver

      The LXC is disposable runtime infrastructure; game data should survive
      container replacement because it lives outside the container.
