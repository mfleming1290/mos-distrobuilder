name: Build and Release

on:
  push:
    tags:
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version'
        required: true
        default: '0.1.2'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Download icon
        run: wget -O icon.png "https://raw.githubusercontent.com/mfleming1290/mos-hub/main/images/distrobuilderIcon.png"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Vue page
        working-directory: page
        env:
          PLUGIN_VERSION: ${{ steps.version.outputs.VERSION }}
        run: npm install && npm run build

      - name: Build plugin deb
        shell: bash
        run: |
          set -eux
          VERSION="${{ steps.version.outputs.VERSION }}"
          PKG_NAME="distrobuilder-${VERSION}-1+mos-plugin"
          PKG_DIR="${PKG_NAME}_amd64"
          DEB_FILE="${PKG_NAME}_amd64.deb"

          mkdir -p "$PKG_DIR/var/www/mos-plugins/distrobuilder"
          mkdir -p "$PKG_DIR/usr/bin/plugins"
          mkdir -p "$PKG_DIR/DEBIAN"

          cp -R page/dist/distrobuilder/* "$PKG_DIR/var/www/mos-plugins/distrobuilder/"
          cp distrobuilder "$PKG_DIR/usr/bin/plugins/distrobuilder"
          chmod 0755 "$PKG_DIR/usr/bin/plugins/distrobuilder"
          cp icon.png "$PKG_DIR/var/www/mos-plugins/distrobuilder/"

          cat > "$PKG_DIR/DEBIAN/control" <<CONTROL
          Package: mos-distrobuilder-plugin
          Version: ${VERSION}-1+mos-plugin
          Architecture: amd64
          Maintainer: mfleming1290
          Description: Distrobuilder LXC image builder plugin for MOS
          CONTROL

          cat > "$PKG_DIR/DEBIAN/postinst" <<'POSTINST'
          #!/bin/bash
          chmod 0755 /usr/bin/plugins/distrobuilder 2>/dev/null || true
          exit 0
          POSTINST
          chmod 0755 "$PKG_DIR/DEBIAN/postinst"

          cat > "$PKG_DIR/DEBIAN/postrm" <<'POSTRM'
          #!/bin/bash
          exit 0
          POSTRM
          chmod 0755 "$PKG_DIR/DEBIAN/postrm"

          dpkg-deb --build "$PKG_DIR" "$DEB_FILE"
          md5sum "$DEB_FILE" | awk '{print $1}' > "${DEB_FILE}.md5"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: MOS Distrobuilder Plugin ${{ steps.version.outputs.VERSION }}
          files: |
            distrobuilder-${{ steps.version.outputs.VERSION }}-1+mos-plugin_amd64.deb
            distrobuilder-${{ steps.version.outputs.VERSION }}-1+mos-plugin_amd64.deb.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
